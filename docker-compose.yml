# docker-compose.yml — ambiente de DESENVOLVIMENTO da WeLog.
# Sobe: app (php-fpm) + nginx + postgres + redis + mailpit + worker + scheduler + vite.
# Uso:
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --seed
# App em http://localhost:8000 | Mailpit em http://localhost:8025 | Vite HMR em :5173
services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile.dev
    image: welog-app-dev
    container_name: welog-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    networks:
      - welog-network

  worker:
    image: welog-app-dev
    container_name: welog-worker
    restart: unless-stopped
    working_dir: /var/www
    # Filas de fundo. `webhooks` vem primeiro como reserva: se o worker
    # dedicado estiver fora do ar, o webhook ainda sai por aqui.
    command: php /var/www/artisan queue:work redis --queue=webhooks,integrations,imports,mail,default --tries=3 --timeout=120
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
    networks:
      - welog-network

  # Worker DEDICADO ao webhook — o mesmo desenho de produção, para o ambiente
  # de desenvolvimento reproduzir o comportamento real da fila.
  worker-webhooks:
    image: welog-app-dev
    container_name: welog-worker-webhooks
    restart: unless-stopped
    working_dir: /var/www
    command: php /var/www/artisan queue:work redis --queue=webhooks --tries=3 --timeout=120
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
    networks:
      - welog-network

  scheduler:
    image: welog-app-dev
    container_name: welog-scheduler
    restart: unless-stopped
    working_dir: /var/www
    # Roda o agendador do Laravel (pollings Omie, despacho Flash 19h, rastreios).
    # Sem este serviço NADA agendado executa.
    command: php /var/www/artisan schedule:work
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
    networks:
      - welog-network

  vite:
    image: node:22-alpine
    container_name: welog-vite
    restart: unless-stopped
    working_dir: /var/www
    # Mesmo uid do container da app (welog): rodando como root, este serviço
    # gravava node_modules e public/build com posse do root, e daí em diante
    # todo `composer require` / `npm run build` falhava com EACCES.
    user: "1000:1000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    networks:
      - welog-network

  nginx:
    image: nginx:alpine
    container_name: welog-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - welog-network

  db:
    image: postgres:16-alpine
    container_name: welog-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-welog}
      - POSTGRES_USER=${DB_USERNAME:-welog_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret_password}
    ports:
      - "5432:5432" # opcional: inspecionar o banco a partir do host
    volumes:
      - welog-db-data:/var/lib/postgresql/data
    networks:
      - welog-network

  redis:
    image: redis:alpine
    container_name: welog-redis
    restart: unless-stopped
    networks:
      - welog-network

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: welog-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - welog-network

  # Túnel público para receber webhooks reais (Omie/Trello) em dev.
  # Sobe sob demanda: docker compose --profile tunnel up -d ngrok
  # Fica fora do `up` padrão (profile) porque exige NGROK_AUTHTOKEN no .env;
  # sem token o contêiner entra em reinício contínuo.
  # Painel/API local para ver a URL pública: http://localhost:4040
  ngrok:
    profiles: ["tunnel"]
    image: ngrok/ngrok:latest
    container_name: welog-ngrok
    restart: unless-stopped
    command: http nginx:80 --log stdout
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    networks:
      - welog-network

networks:
  welog-network:
    driver: bridge

volumes:
  welog-db-data:
