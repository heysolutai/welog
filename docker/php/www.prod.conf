; Pool do PHP-FPM em produção.
;
; A imagem php:8.4-fpm vem com o pool de exemplo: `pm = dynamic` e
; `pm.max_children = 5`. Cinco. É o teto de requisições PHP simultâneas da
; plataforma inteira, e nenhum ajuste de código passa por ele — com a sexta
; pessoa, o nginx já está esperando na fila do socket. Numa campanha em que
; milhares abrem o e-mail no mesmo minuto, é aqui que tudo para.
;
; Os números abaixo são calculados, não chutados. Cada processo PHP desta
; aplicação ocupa ~48 MB residentes (Laravel + OPcache compartilhado; medido
; com `ps -o rss` sob carga). A conta do teto é:
;
;     max_children = (RAM dedicada ao PHP) / 48 MB
;
; e RAM dedicada é a da máquina MENOS o que Postgres, Redis, nginx e o sistema
; precisam. As duas variáveis de ambiente abaixo existem para essa conta poder
; ser refeita quando a máquina mudar de tamanho, sem reconstruir a imagem.
;
; Ver docs/CAPACIDADE.md para a tabela de dimensionamento.

[www]
user = www-data
group = www-data
listen = 9000

; `static` e não `dynamic`: num pico, `dynamic` gasta os primeiros segundos
; FORKANDO processo enquanto as requisições se empilham — exatamente quando não
; há tempo sobrando. Com `static` os processos já estão de pé antes do disparo.
; O custo é RAM ociosa fora do pico, que é o preço certo a pagar aqui.
pm = ${PHP_FPM_MODE}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}

; Usados só quando PHP_FPM_MODE=dynamic (máquina pequena, fora de campanha).
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_START_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_CHILDREN}

; Fila de espera do socket. O padrão (511) devolve "connection refused" ao
; nginx assim que estoura, e o visitante vê 502 — pior do que esperar meio
; segundo. Uma fila funda transforma pico em espera, que é o que se quer.
listen.backlog = 4096

; Vazamento de memória de terceiros não derruba o processo para sempre: ele é
; reciclado a cada N requisições. Alto de propósito — reciclar cedo demais
; joga fora o OPcache já aquecido bem no meio do pico.
pm.max_requests = 2000

; Requisição que passa disso está pendurada em algo (banco travado, integração
; sem resposta) e só ocupa um dos processos. Abaixo do `fastcgi_read_timeout`
; do nginx, para o erro sair daqui com log e não como 504 mudo.
request_terminate_timeout = 120
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Health check e métricas do pool (quantos filhos ativos, tamanho da fila).
; Sem isto, dimensionar é adivinhação: é esta página que diz se `max_children`
; ficou curto durante a campanha. Só pela rede interna — o nginx não a publica.
pm.status_path = /fpm-status
ping.path = /fpm-ping

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
