; OPcache no ambiente de DESENVOLVIMENTO.
;
; A imagem oficial do PHP compila o OPcache mas deixa desligado. Sem ele, cada
; requisição reabre e reinterpreta os ~500 arquivos do Laravel + vendor — e
; aqui o código vem por bind-mount do Windows, onde cada leitura cruza a
; fronteira com a VM do Docker. Medido nesta máquina: 9,9s para ler 3.000
; arquivos do bind-mount contra 7ms no disco do container.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; DEV precisa ver a edição sem derrubar o container, então o carimbo de data
; continua sendo conferido — mas no máximo a cada 2s, não a cada requisição.
; É esse `stat` que custa caro no bind-mount. Em produção isto vira 0.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; CLI fica de fora: cada `artisan` é um processo novo e o cache morre com ele,
; então só se pagaria o custo de montá-lo.
opcache.enable_cli=0

; Cache de caminhos resolvidos. O padrão (4M/120s) estoura com o vendor do
; Laravel e o PHP volta a resolver cada caminho no disco lento.
realpath_cache_size=8M
realpath_cache_ttl=600
