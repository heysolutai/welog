# Server block de PRODUÇÃO — HTTP redireciona para HTTPS; HTTPS serve o app.
#
# O certificado em /etc/letsencrypt/live/welog SEMPRE existe: se o Let's
# Encrypt ainda não emitiu, o container nginx gera um self-signed de fallback
# no boot (ver `command` do nginx no docker-compose.prod.yml). Assim o nginx
# NUNCA entra em crash-loop por falta de certificado. Quando o cert real é
# emitido (docker/nginx/init-letsencrypt.sh) ele substitui o fallback no mesmo
# caminho e o nginx recarrega — o aviso de "não seguro" do navegador some.

server {
    listen 80;
    server_name _;

    # Desafio ACME (HTTP-01) do Let's Encrypt — precisa ser servido em HTTP
    # puro e ANTES do redirect, senão a emissão/renovação do certificado falha.
    location /.well-known/acme-challenge/ {
        root /var/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 75M;

    # IP real do visitante atrás do Cloudflare. Sem isto todo limitador
    # do Laravel passa a enxergar um punhado de IPs de datacenter.
    include /etc/nginx/cloudflare.conf;

    ssl_certificate     /etc/letsencrypt/live/welog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/welog/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Cabeçalhos de segurança (voltam com o TLS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }

    # Saúde do pool de PHP: quantos processos ativos e, principalmente, quantas
    # requisições estão ESPERANDO na fila do socket. É o número que diz se
    # `PHP_FPM_MAX_CHILDREN` ficou curto durante uma campanha — sem ele,
    # dimensionar é adivinhação (ver docs/CAPACIDADE.md).
    #
    # Só da rede interna do Docker: a página expõe o caminho dos scripts e o
    # que cada processo está executando.
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        access_log off;
    }

    # Fotos de kit enviadas pela WeGift (symlink para storage/app/public).
    # A validação do upload já exige imagem, mas este diretório é alimentado por
    # upload: negar execução aqui é a segunda tranca. `^~` vence a regex de .php.
    location ^~ /storage/ {
        location ~ \.php$ {
            return 404;
        }
    }

    # Assets compilados com cache longo
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
