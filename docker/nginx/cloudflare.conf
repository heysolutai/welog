# IP REAL do visitante quando o Cloudflare está na frente.
#
# Sem isto, TODA requisição chega ao nginx com o IP de um datacenter do
# Cloudflare — e é esse IP que o Laravel usa nos limitadores. O efeito é o pior
# dos dois mundos ao mesmo tempo: o limite de 5 tentativas por minuto no login
# passa a valer para o planeta inteiro somado (a primeira pessoa que erra a
# senha tranca as outras), e o limite por IP deixa de identificar qualquer
# atacante, porque todos compartilham o mesmo endereço aparente.
#
# `CF-Connecting-IP` é o cabeçalho que o Cloudflare escreve com o IP de origem
# real. Ele é confiável PORQUE `set_real_ip_from` abaixo só aceita esse
# cabeçalho de quem vem das faixas do próprio Cloudflare — de qualquer outra
# origem, o cabeçalho é ignorado.
#
# Isso, porém, só fecha de verdade com o firewall do VPS liberando 80/443
# apenas para as faixas abaixo. Com a porta aberta ao mundo, alguém que
# descubra o IP de origem bate direto e pula o Cloudflare inteiro.
#
# Lista oficial: https://www.cloudflare.com/ips/ — ela muda raramente, mas
# muda. Vale reconferir a cada revisão de infraestrutura.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
